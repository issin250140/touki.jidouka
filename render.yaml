# Render.com 用の設定ファイル（Blueprint）
# Renderで「New +」→「Blueprint」からこのリポジトリを選ぶと、
# この内容にそって自動でサービスが作成されます。
#
# SITE_USERS は sync:false のため、Render側の画面で手動入力を求められます
# （このファイルにパスワードそのものは書き込まれません）。
services:
  - type: web
    name: land-finder
    env: docker
    plan: free
    region: singapore  # 日本(農地ナビ)に近いリージョンを使う
    envVars:
      # 「ユーザー名:パスワード」をカンマ区切りで。例: tanaka:abc123,sato:xyz789
      - key: SITE_USERS
        sync: false
      - key: SITE_ENABLED
        value: "true"
